spring.application.name=api-gateway

server.port=${PORT:8080}


# ==========================================
# User Service
# ==========================================

spring.cloud.gateway.server.webflux.routes[0].id=user-service

spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/users/**


# ==========================================
# Wallet Service
# ==========================================

spring.cloud.gateway.server.webflux.routes[1].id=wallet-service

spring.cloud.gateway.server.webflux.routes[1].uri=${WALLET_SERVICE_URL:http://localhost:8082}

spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/wallets/**,/transfers/**,/transactions/**


# ==========================================
# CORS
# ==========================================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_URL:http://localhost:5173}

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true